name: Storybook

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/storybook.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/storybook.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.detect.outputs.built }}
      package_dir: ${{ steps.detect.outputs.package_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Storybook package
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$(node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const ignored = new Set(['node_modules', '.git', '.next', 'dist', 'build', 'coverage']);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                const nested = walk(full);
                if (nested) return nested;
                continue;
              }
              if (entry.name !== 'package.json') continue;
              const pkg = JSON.parse(fs.readFileSync(full, 'utf8'));
              if (pkg?.scripts?.['build-storybook']) {
                process.stdout.write(path.relative(root, path.dirname(full)));
                return path.dirname(full);
              }
            }
            return null;
          }

          walk(root);
          NODE
          )"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "No package with a build-storybook script exists in this repo."
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "package_dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found Storybook package at $PACKAGE_DIR"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.built == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ steps.detect.outputs.package_dir }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.built == 'true'
        working-directory: ${{ steps.detect.outputs.package_dir }}
        run: npm ci

      - name: Build Storybook
        if: steps.detect.outputs.built == 'true'
        working-directory: ${{ steps.detect.outputs.package_dir }}
        run: npm run build-storybook

      - name: Inspect Storybook output
        if: steps.detect.outputs.built == 'true'
        working-directory: ${{ steps.detect.outputs.package_dir }}
        run: ls -laR . || true

      - name: Upload static Storybook
        if: steps.detect.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.package_dir }}/storybook-static

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-storybook
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-storybook.result == 'success' && needs.build-storybook.outputs.built == 'true' && vars.ENABLE_STORYBOOK_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
